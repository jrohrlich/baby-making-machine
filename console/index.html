<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Karla:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --marigold: #F6BD60; --cream: #F7EDE2; --blush: #F5CAC3; --sage: #84A59D; --coral: #F28482; --ink: #4A3630; --ink-soft: #7A625A; --paper: #FFFAF4; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--cream); color: var(--ink); font: 400 16px/1.6 "Karla", "Inter", sans-serif; }
  /* Same drifting eggs and swimming sperm as the landing page */
  #swim { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .card { position: relative; z-index: 1; width: min(400px, 100%); background: var(--paper); border-radius: 36px 36px 36px 90px; padding: 36px 30px 32px; text-align: center; box-shadow: 0 24px 50px -30px rgba(74,54,48,.45); }
  /* Sperm meets locked egg */
  .stage { display: block; width: 100%; max-width: 300px; height: auto; margin: -8px auto 10px; overflow: visible; }
  .egg-ring { fill: #fff6; stroke: var(--coral); stroke-width: 2; transition: fill .5s .5s; }
  .egg-core { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  .egg { transform-box: fill-box; transform-origin: center; }
  .keyhole { transition: opacity .3s .5s; }
  .swimmer { transition: transform .5s cubic-bezier(.3,1.4,.5,1), opacity .3s; }
  .swimmer .tail { animation: wiggle .3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: right center; }
  .heart { opacity: 0; transform-box: fill-box; transform-origin: center bottom; transform: scale(.3) translateY(14px); transition: opacity .3s .6s, transform .5s .6s cubic-bezier(.3,1.8,.5,1); }
  .stage.in .swimmer { transition: transform .7s cubic-bezier(.45,.1,.35,1), opacity .25s .55s; opacity: 0; }
  .stage.in .egg-ring { fill: #fde3d3; }
  .stage.in .keyhole { opacity: 0; }
  .stage.in .heart { opacity: 1; transform: none; }
  .stage.nope .egg { animation: wobble .45s; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  @keyframes wiggle { from { transform: skewY(-14deg); } to { transform: skewY(14deg); } }
  @keyframes wobble { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  h1 { font: 800 1.6rem/1.15 "Nunito", sans-serif; margin-bottom: 6px; }
  p { color: var(--ink-soft); margin-bottom: 22px; }
  input[type=password] { width: 100%; font: 500 1rem "Karla", sans-serif; color: var(--ink); background: var(--cream); border: 2px solid transparent; border-radius: 999px; padding: 13px 18px; outline: none; transition: border-color .2s; }
  input[type=password]:focus { border-color: var(--marigold); }
  label { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 20px; font-size: .92rem; color: var(--ink-soft); cursor: pointer; }
  label input { accent-color: var(--sage); width: 16px; height: 16px; }
  button { width: 100%; cursor: pointer; border: 0; background: var(--marigold); color: var(--ink); font: 800 1rem "Nunito", sans-serif; padding: 14px; border-radius: 999px; box-shadow: 0 5px 0 #d99e3f; transition: transform .2s, box-shadow .2s; }
  button:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #d99e3f; }
  button:disabled { opacity: .6; pointer-events: none; }
  .err { color: #c0504e; font-size: .92rem; min-height: 1.5em; margin-top: 12px; }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

const KEY = 'bmm-console-key';
const $ = id => document.getElementById(id);
const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function derive(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(VAULT.salt), iterations: VAULT.iter }, base, 256);
}

async function open(kekRaw) {
  const kek = await crypto.subtle.importKey('raw', kekRaw, 'AES-GCM', false, ['decrypt']);
  for (const k of VAULT.keys) {
    try {
      const dekRaw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(k.iv) }, kek, bytes(k.ct));
      const dek = await crypto.subtle.importKey('raw', dekRaw, 'AES-GCM', false, ['decrypt']);
      const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(VAULT.payload.iv) }, dek, bytes(VAULT.payload.ct));
      return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    } catch {}
  }
  return null;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let running = true;
function show(html) { running = false; document.open(); document.write(html); document.close(); }

// The sperm creeps toward the egg as the password grows, swims in on success, bounces off on failure.
const stage = $('stage'), swimmer = $('swimmer');
const creep = () => { swimmer.style.transform = `translateX(${Math.min($('pw').value.length, 16) * 5}px)`; };
$('pw').addEventListener('input', creep);
const pause = ms => new Promise(r => setTimeout(r, reduceMotion ? 0 : ms));
async function celebrate() {
  swimmer.style.transform = 'translateX(158px)';
  stage.classList.add('in');
  await pause(1300);
}
async function bounce() {
  swimmer.style.transform = 'translateX(108px)';
  await pause(260);
  stage.classList.add('nope');
  swimmer.style.transform = 'translateX(0)';
  await pause(450);
  stage.classList.remove('nope');
}

async function tryRemembered() {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  if (!saved) return;
  $('card').hidden = true;
  const html = await open(bytes(saved)).catch(() => null);
  if (html) return show(html);
  // Password was revoked or changed: forget it and ask again.
  try { localStorage.removeItem(KEY); } catch {}
  $('card').hidden = false;
  $('msg').textContent = 'Your access has changed. Pop in your current password.';
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('go').disabled = true; $('go').textContent = 'Unlocking…'; $('err').textContent = '';
  const kekRaw = await derive($('pw').value);
  const html = await open(kekRaw).catch(() => null);
  if (html) {
    if ($('remember').checked) try { localStorage.setItem(KEY, b64(kekRaw)); } catch {}
    $('go').textContent = 'Congratulations!';
    await celebrate();
    return show(html);
  }
  $('go').disabled = false; $('go').textContent = 'Fertilize!';
  await bounce();
  $('err').textContent = "Hmm, that's not it. Try again?";
  $('card').classList.remove('shake'); void $('card').offsetWidth; $('card').classList.add('shake');
  $('pw').select();
});

// ---------- Background: drifting eggs & swimming sperm (same as the landing page) ----------
const cv = $('swim');
const ctx = cv.getContext('2d');
let W, H, eggs = [], sperm = [];
const pointer = { x: -999, y: -999 };
const rand = (a, b) => a + Math.random() * (b - a);

function setup() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const small = W < 700;
  eggs = Array.from({ length: small ? 2 : 4 }, () => ({
    x: rand(0, W), y: rand(0, H), r: rand(18, 32),
    vx: rand(-.08, .08), vy: rand(-.06, .06), t: rand(0, 6),
  }));
  sperm = Array.from({ length: small ? 8 : 16 }, () => ({
    x: rand(0, W), y: rand(0, H), a: rand(0, Math.PI * 2),
    v: rand(.35, .7), t: rand(0, 6), turn: 0,
  }));
}

function wrap(o, m) {
  if (o.x < -m) o.x = W + m; if (o.x > W + m) o.x = -m;
  if (o.y < -m) o.y = H + m; if (o.y > H + m) o.y = -m;
}

function steer(s, tx, ty, strength) {
  const want = Math.atan2(ty - s.y, tx - s.x);
  s.a += Math.atan2(Math.sin(want - s.a), Math.cos(want - s.a)) * strength;
}

function drawEgg(e) {
  const r = e.r * (1 + Math.sin(e.t) * .05);
  ctx.fillStyle = 'rgba(245,202,195,.45)';
  ctx.strokeStyle = 'rgba(242,132,130,.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(242,132,130,.35)';
  ctx.beginPath(); ctx.arc(e.x, e.y, r * .25, 0, Math.PI * 2); ctx.fill();
}

function drawSperm(s) {
  const cos = Math.cos(s.a), sin = Math.sin(s.a);
  ctx.strokeStyle = 'rgba(74,54,48,.2)';
  ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 14; i++) {
    const d = 4 + i * 2.2;
    const wob = Math.sin(s.t * 9 - i * .7) * i * .32;
    const px = s.x - cos * d - sin * wob, py = s.y - sin * d + cos * wob;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  ctx.save();
  ctx.translate(s.x, s.y); ctx.rotate(s.a);
  ctx.fillStyle = 'rgba(74,54,48,.26)';
  ctx.beginPath(); ctx.ellipse(0, 0, 4.4, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function tick() {
  if (!running) return;  // stop once the console replaces this page
  ctx.clearRect(0, 0, W, H);
  for (const e of eggs) { e.x += e.vx; e.y += e.vy; e.t += .015; wrap(e, 40); drawEgg(e); }
  for (const s of sperm) {
    s.t += .016;
    s.turn += rand(-.02, .02); s.turn *= .96; s.a += s.turn;
    const pd = Math.hypot(pointer.x - s.x, pointer.y - s.y);
    const chasing = pd < 420;
    let near = null, nd = 1e9;
    for (const e of eggs) { const d = Math.hypot(e.x - s.x, e.y - s.y); if (d < nd) { nd = d; near = e; } }
    if (chasing) steer(s, pointer.x, pointer.y, .02 + .06 * (1 - pd / 420));
    else if (nd < 260 && nd > near.r + 30) steer(s, near.x, near.y, .012);
    if (nd < near.r + 14) steer(s, 2 * s.x - near.x, 2 * s.y - near.y, .15);
    const speed = s.v * (chasing ? 1.8 : 1);
    s.x += Math.cos(s.a) * speed; s.y += Math.sin(s.a) * speed;
    wrap(s, 40); drawSperm(s);
  }
  if (!reduceMotion) requestAnimationFrame(tick);
}

setup(); tick();
addEventListener('resize', () => { if (running) { setup(); if (reduceMotion) tick(); } });
addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
document.addEventListener('pointerleave', () => { pointer.x = pointer.y = -999; });

tryRemembered();
})();
</script>
